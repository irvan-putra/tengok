name: tengok signed release

# Manual only. patuh source gate first, then builds the release APK, signs it with the
# tengok key from repository secrets, verifies the signature and package, byte-checks the
# candidate via patuh, then publishes a GitHub pre-release and verifies it live.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consistency:
    # patuh pre-publish source gate: package, version format, label,
    # permission/license drift, family icon geometry, badge reads the
    # candidate version. A failure stops the release before anything builds.
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@f05b5b148382a18661c616a76fd2d5ed9e6d88ba
    with:
      app: tengok
      published: false

  release:
    needs: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      EXPECTED_CERT_SHA256: "439CF7177600DCB04E32A197AD0BC1FD084B78DC329224201EC2A1845E9B8EE9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Read version
        id: v
        run: |
          VER=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build and sign
        env:
          TENGOK_KEYSTORE_B64: ${{ secrets.TENGOK_KEYSTORE_B64 }}
          TENGOK_STORE_PASSWORD: ${{ secrets.TENGOK_STORE_PASSWORD }}
          TENGOK_KEY_ALIAS: ${{ secrets.TENGOK_KEY_ALIAS }}
          TENGOK_KEY_PASSWORD: ${{ secrets.TENGOK_KEY_PASSWORD }}
        run: |
          echo "$TENGOK_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tengok.jks"
          export TENGOK_KEYSTORE_FILE="$RUNNER_TEMP/tengok.jks"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/tengok.jks"
      - name: Verify signature, package and permissions
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.v.outputs.version }}"
          APK="app/build/outputs/apk/release/tengok-v${VER}-release.apk"
          test -f "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' /tmp/cert.txt | awk '{print toupper($NF)}')
          echo "cert digest extracted: [$GOT]"
          test "$GOT" = "$EXPECTED_CERT_SHA256"
          echo "cert pin matches"
          "$BT/aapt" dump badging "$APK" | head -3
          "$BT/aapt" dump badging "$APK" | grep -F "package: name='com.vanipy.tengok'"
          "$BT/aapt" dump badging "$APK" | grep -F "versionName='${VER}'"
          if "$BT/apksigner" verify --print-certs "$APK" | grep -q 'DEBUG'; then exit 1; fi
          ci/check_permissions.sh "$BT/aapt" "$APK"
          cp "$APK" "tengok-v${VER}.apk"
          sha256sum "tengok-v${VER}.apk" | tee "tengok-v${VER}.apk.sha256"
      - name: Upload candidate APK for the byte check
        uses: actions/upload-artifact@v4
        with:
          name: candidate-apk
          path: |
            tengok-v${{ steps.v.outputs.version }}.apk
            tengok-v${{ steps.v.outputs.version }}.apk.sha256
          retention-days: 1

  candidate-bytes:
    # patuh checks the built APK's actual bytes (packaged icon badge) before
    # anything is published. This is the preventive boundary.
    needs: release
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@f05b5b148382a18661c616a76fd2d5ed9e6d88ba
    with:
      app: tengok
      published: false
      candidate_apk_artifact: candidate-apk

  publish:
    # release must be a direct need for needs.release.outputs.version to
    # resolve; the needs context covers direct dependencies only
    needs: [candidate-bytes, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_CERT_SHA256: "439CF7177600DCB04E32A197AD0BC1FD084B78DC329224201EC2A1845E9B8EE9"
    steps:
      - uses: actions/download-artifact@v4
        with: { name: candidate-apk, path: dist }
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          # no checkout in this job: gh needs explicit repository context
          GH_REPO: ${{ github.repository }}
        run: |
          VER="${{ needs.release.outputs.version }}"
          cp "dist/tengok-v${VER}.apk" "dist/tengok-v${VER}.apk.sha256" .
          cat > notes.md <<NOTES
          tengok ${VER}: peek into any file. MIDI songs show their summary, instruments and a piano roll and play on the phone's built-in synth; images zoom; audio and video play; text reads; everything else opens in a paged hex view with a details sheet (type, size, SHA-256). Offline, no accounts, zero Android permissions, files never leave the phone.

          0.8.0 adds viewers for PDF (page by page on the phone's own PDF engine, no text selection or search), basic SVG (shapes, paths and text; skipped features are listed), and a text preview of Word, Excel and PowerPoint files (.docx, .xlsx, .pptx). No new permissions or libraries; older .doc/.xls/.ppt and OpenDocument files still open as hex. Password-protected PDFs and XML files that declare entities are refused. A PDF inside a ZIP opens as bytes.

          0.7.1: tap stored/deflated ZIP entries to open text, images, audio, MIDI or hex in memory. No temporary files or new permissions. Entry opening is limited to 16 MB and 100:1 compression, with CRC checks. Nested ZIPs and Android videos inside ZIP use hex; no password opening.

          0.7.0 adds read-only ZIP contents: paths, sizes and encrypted-entry labels. Bounded to 32 MB and 2,000 entries; no extraction, ZIP64, split ZIPs or password opening. Archive contents are never decompressed or written. Still offline, zero Android permissions.

          0.6.1 fixes re-opening a file another app shared (like a bidik recording) from the recent-files list after the one-time share access has lapsed: it now shows the same "pick the file again" card as any other lost access instead of an error with a hex offer that could only fail the same way, and tengok declares visibility of bidik's share provider so such files reach that path at all. The file itself is never touched. Still offline, still zero Android permissions.

          0.6.0 plays video: mp4/mkv/webm/mov/3gp open in a real player instead of the hex view. Variable frame-rate recordings play at the speed they were recorded - each frame's own timestamp is honored, the MP4 index is found wherever the muxer wrote it (including at the end of the file behind a 64-bit mdat size), sound starts on its own offset, and silent recordings with no audio track play fine. Proven on the emulator against real Bidik screen recordings, byte-identical captures from bidik's record-check CI. Still offline, still zero Android permissions.

          Game mode turns any MIDI song into falling notes you can tap on an on-screen piano or play on a USB MIDI keyboard. Velocity and human timing stay as played, with no snapping. Scores and the diagnostic log stay on the phone; sharing a crash or diagnostics is always your tap.

          0.3.2 makes the on-screen piano playable on a phone: keys keep a finger-sized minimum width and the board pans by itself to keep the next notes in view; drag sideways on the keys to look around without striking. A tap still grades at the instant the finger lands. A live letter rank (D up to SSS, from accuracy plus your streak, so a miss pulls it down) shows in the lane while you play and as the final grade. The home screen keeps a recent-files list so a file opened once is one tap away: removing an entry only clears the list, the file itself is never touched, and reopening uses the access Android already granted. Still offline, still zero Android permissions.

          0.4.0: every finger is heard on the game keyboard, so notes that need keys together can be struck together - chords work now. Files can also be saved in a different format from the viewer (re-encode an image, or re-encode text as UTF-8) through the normal system save picker; the original file is never modified. Still offline, still zero Android permissions.

          0.3.9 finishes the glide work from 0.3.8: a board sweep now always glides all the way to its target and eases out there instead of stopping dead at the edge of the comfort zone, and a paused or interrupted sweep can never snap to its end when the song resumes.

          0.3.8 polishes game feel: a struck note keeps sinking into the piano instead of vanishing on tap, the board glide sweeps smoothly to the next notes with no lurch at the start or end, and hit sparks stay in a tight column right at the border between the falling notes and the piano instead of spreading over the screen.

          The built-in folder explorer lists a folder you pick once, so you can open files without leaving the app. Browsing is read-only: no delete, rename or move.

          Signed with the tengok key (certificate SHA-256 ${EXPECTED_CERT_SHA256}).
          SHA-256 of the APK is in the attached .sha256 file.
          NOTES
          gh release create "v${VER}" "tengok-v${VER}.apk" "tengok-v${VER}.apk.sha256" \
            --title "tengok ${VER}" --notes-file notes.md --prerelease --target "${GITHUB_SHA}"

  verify:
    # post-publish: verifies the live release (tag, APK name, checksum,
    # gallery card, downloaded sha256, packaged icon). Detects, cannot undo.
    # The kaji gallery card is updated by the release owner right after
    # publish; re-run this job once the card matches.
    needs: publish
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@f05b5b148382a18661c616a76fd2d5ed9e6d88ba
    with:
      app: tengok
      published: true
