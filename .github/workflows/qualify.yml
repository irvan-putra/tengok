name: tengok qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: tengok-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Verify launcher icon matches the app version
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow==12.3.0
          VER=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          python3 tools/badge_icon.py "$VER"
          git diff --exit-code -- app/src/main/res || { echo "launcher icon is stale; run: python3 tools/badge_icon.py $VER and commit"; exit 1; }
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Assert package ID, version and no permissions
        shell: bash
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          CODE=$(sed -n 's/^val appVersionCode = \(.*\)/\1/p' app/build.gradle.kts)
          APK="app/build/outputs/apk/debug/tengok-v${VER}-debug.apk"
          test -f "$APK"
          find app/build/outputs/apk/debug -type f -name '*.apk'
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.vanipy.tengok' versionCode='${CODE}' versionName='${VER}'"
          if "$AAPT" dump permissions "$APK" | grep -q 'uses-permission'; then echo "unexpected permission"; "$AAPT" dump permissions "$APK"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: tengok-qualification-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 5
